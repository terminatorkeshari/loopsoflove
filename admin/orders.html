<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Operations — Admin</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="assets/admin.css">
<style>
  .action-btns { display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <span class="logo">Loops<span class="halo-dot"> of Love</span></span>
    <nav class="admin-nav" id="admin-nav"></nav>
    <div class="signout"><button id="signout-btn">Sign out</button></div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar"><h1>Order Operations</h1></div>

    <div class="panel">
      <p class="panel-desc">Every order triggers a WhatsApp notification automatically. Use this dashboard to manage status, print thermal shipping slips, or delete invalid orders.</p>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Order #</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Items</th>
            <th>Coupon</th>
            <th>Total</th>
            <th>Status</th>
            <th>Placed</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
import { requireAdmin, renderSidebar, api, formatPrice, toast } from './assets/js/admin.js';

const admin = await requireAdmin();
let allOrders = [];

if (admin) {
  renderSidebar('orders.html', admin.email || 'Admin');
  loadOrders();
}

const STATUSES = ['placed', 'confirmed', 'shipped', 'delivered', 'cancelled'];

async function loadOrders() {
  const res = await api('admin?resource=orders');
  allOrders = res.orders || [];
  
  document.getElementById('orders-body').innerHTML = allOrders.map(o => `
    <tr>
      <td><strong>${o.order_number}</strong></td>
      <td>${o.customer_name}<br><span style="color:rgba(59,36,50,0.55); font-size:11px;">${o.address}</span></td>
      <td>${o.phone}</td>
      <td>${(o.items || []).map(i => `${i.name} ×${i.qty}`).join(', ')}</td>
      <td>${o.coupon_code ? `<span class="pill pill-green">${o.coupon_code}</span> -${formatPrice(o.discount_amount || 0)}` : '—'}</td>
      <td><strong>${formatPrice(o.total)}</strong></td>
      <td>
        <select data-id="${o.id}" class="status-select" style="padding: 6px; border-radius: 6px; border: 1px solid var(--pink-soft);">
          ${STATUSES.map(s => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </td>
      <td style="font-size: 12px; color: rgba(59,36,50,0.6);">${new Date(o.created_at).toLocaleString()}</td>
      <td>
        <div class="action-btns">
          <button class="btn btn-sm print-btn" data-id="${o.id}" style="background: var(--pink-soft); color: var(--berry); border: none;">Print Slip</button>
          <button class="btn btn-sm btn-danger delete-btn" data-id="${o.id}" style="padding: 6px 10px; font-size: 11px;">Delete</button>
        </div>
      </td>
    </tr>`).join('') || `<tr><td colspan="9" style="text-align:center; padding: 30px;">No orders yet.</td></tr>`;

  // Attach status change events
  document.querySelectorAll('.status-select').forEach(sel => {
    sel.onchange = async () => {
      try {
        await api('admin?resource=orders', { method: 'PUT', body: JSON.stringify({ id: sel.dataset.id, status: sel.value }) });
        toast('Status updated');
      } catch {
        toast('Could not update status');
      }
    };
  });

  // Attach print button events
  document.querySelectorAll('.print-btn').forEach(btn => {
    btn.onclick = () => {
      const order = allOrders.find(o => o.id === btn.dataset.id);
      if (order) printShippingLabel(order);
    };
  });

  // Attach delete button events
  document.querySelectorAll('.delete-btn').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      if (!confirm('Are you sure you want to delete this order permanently?')) return;
      try {
        await api('admin?resource=orders', { method: 'DELETE', body: JSON.stringify({ id }) });
        toast('Order deleted');
        loadOrders();
      } catch (err) {
        toast('Could not delete order — ' + err.message);
      }
    };
  });
}

function printShippingLabel(order) {
  // Open a clean 3-inch thermal print window layout
  const printWindow = window.open('', '_blank', 'width=400,height=600');
  
  const itemsHtml = (order.items || []).map(i => `
    <div style="display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px;">
      <span>${i.name} (x${i.qty})</span>
      <span>₹${(i.price * i.qty).toFixed(2)}</span>
    </div>
  `).join('');

  printWindow.document.write(`
    <html>
      <head>
        <title>Shipping Label - ${order.order_number}</title>
        <style>
          body { font-family: 'Poppins', Arial, sans-serif; padding: 15px; color: #000; width: 280px; margin: 0 auto; }
          .center { text-align: center; }
          .logo { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin: 0 auto 8px; display: block; }
          .divider { border-top: 1px dashed #000; margin: 10px 0; }
          .bold { font-weight: bold; }
          .box { border: 1px solid #000; padding: 8px; border-radius: 6px; margin-top: 10px; }
        </style>
      </head>
      <body>
        <!-- Replace with your actual Supabase public URL for the logo -->
        <div class="center">
          <h2 style="margin: 0; font-size: 18px; font-family: 'Baloo 2', cursive;">Loops of Love</h2>
          <div style="font-size: 10px; letter-spacing: 1px; text-transform: uppercase;">Shipping Label</div>
        </div>
        
        <div class="divider"></div>
        
        <div style="font-size: 12px;">
          <div><span class="bold">Order #:</span> ${order.order_number}</div>
          <div><span class="bold">Date:</span> ${new Date(order.created_at).toLocaleString()}</div>
        </div>

        <div class="box">
          <div class="bold" style="font-size: 11px; text-transform: uppercase; margin-bottom: 4px;">Ship To:</div>
          <div style="font-size: 14px; font-weight: bold;">${order.customer_name}</div>
          <div style="font-size: 12px; margin: 4px 0;">${order.address}</div>
          <div style="font-size: 12px;"><span class="bold">Phone:</span> ${order.phone}</div>
        </div>

        <div class="divider"></div>

        <div class="bold" style="font-size: 11px; text-transform: uppercase; margin-bottom: 6px;">Items Ordered:</div>
        ${itemsHtml}

        <div class="divider"></div>

        <div style="display: flex; justify-content: space-between; font-size: 14px;" class="bold">
          <span>Total Amount:</span>
          <span>₹${Number(order.total).toFixed(2)}</span>
        </div>

        <div class="divider"></div>
        <div class="center" style="font-size: 10px; margin-top: 10px;">
          Thank you for your order! ❤️<br>Loops of Love
        </div>

        <script>
          window.onload = () => { window.print(); window.close(); }
        <\/script>
      </body>
    </html>
  `);
  printWindow.document.close();
}
</script>
</body>
</html>
